<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识库管理</title>
    <script type="module" src="/src/admin.js"></script>
  </head>
  <body>
  <div class="layout-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-dot">R</div>
        <div>
          <div class="brand-title">Ragent AI 管理后台</div>
          <div class="brand-sub">Knowledge Console</div>
        </div>
      </div>
      <nav class="menu">
        <div class="menu-group-title">导航</div>
        <div class="menu-item active">知识库构建</div>
      </nav>
      <a class="back-link" href="/">返回对话页</a>
    </aside>

    <main class="content">
      <header class="topbar card">
        <div class="topbar-search-wrap">
          <input id="listKeyword" class="field-input top-search-input" type="text" placeholder="筛选知识库..." />
          <button type="button" class="btn-ghost" id="searchBtn">搜索</button>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-ghost" id="themeToggle" title="切换明暗">◐</button>
          <button type="button" class="btn-ghost" onclick="window.location.href='/'">返回聊天</button>
          <span class="user-pill">admin</span>
        </div>
      </header>

      <section class="build-shell">
        <section class="crumb-line">
          <div id="breadcrumb" class="breadcrumb"></div>
        </section>

        <header class="build-header">
          <div>
            <h1>知识库构建</h1>
            <p id="headerDesc">管理知识库、文档导入、解析与分块流程</p>
          </div>
          <div class="header-actions-right">
            <button type="button" class="btn-ghost" id="refreshBtn">刷新</button>
            <button type="button" class="btn-primary" id="primaryActionBtn">新建知识库</button>
          </div>
        </header>

        <section class="metric-grid">
          <article class="metric-card">
            <div class="metric-title">知识库</div>
            <div class="metric-value">1</div>
          </article>
          <article class="metric-card">
            <div class="metric-title">文档数</div>
            <div class="metric-value">5</div>
          </article>
          <article class="metric-card">
            <div class="metric-title">可用文档</div>
            <div class="metric-value">1</div>
          </article>
          <article class="metric-card">
            <div class="metric-title">活跃用户</div>
            <div class="metric-value">1</div>
          </article>
        </section>

        <section class="panel card" id="uploadSection" hidden>
          <h2>文档导入</h2>
          <form id="uploadForm" class="upload-inline">
            <input id="uploadKbId" class="field-input" type="text" placeholder="进入知识库后自动填充 kbId" required />
            <input id="docFile" class="field-input" type="file" required />
            <button type="submit" class="btn-primary">上传文档</button>
          </form>
        </section>

        <section class="panel card" id="listSection">
          <div class="list-head">
            <h2 id="listTitle">知识库列表</h2>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <span id="pageInfo">第 1 页</span>
            <div class="pager-actions">
              <button type="button" class="btn-ghost" id="prevPageBtn">上一页</button>
              <button type="button" class="btn-ghost" id="nextPageBtn">下一页</button>
            </div>
          </div>
        </section>

        <section class="panel card dual-log">
          <div class="log-col">
            <h2>执行日志</h2>
            <div id="opLog" class="op-log"></div>
          </div>
          <div class="log-col">
            <h2>接口原始返回</h2>
            <div id="rawPayload" class="op-log"></div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <div class="modal-mask" id="createModal" hidden>
    <section class="modal-panel">
      <div class="modal-head">
        <h3>新建知识库</h3>
        <button type="button" class="btn-ghost" id="closeCreateModalBtn">关闭</button>
      </div>
      <form id="createKbForm" class="form-grid">
        <label class="field-label" for="kbName">知识库名称</label>
        <input id="kbName" class="field-input" type="text" maxlength="128" placeholder="例如：产品手册库" required />
        <label class="field-label" for="kbDesc">描述（可选）</label>
        <textarea id="kbDesc" class="field-input field-textarea" rows="3" placeholder="描述这个知识库用途"></textarea>
        <button type="submit" class="btn-primary">创建知识库</button>
      </form>
    </section>
  </div>
  <div class="modal-mask" id="chunkDetailModal" hidden>
    <section class="modal-panel modal-panel-wide">
      <div class="modal-head">
        <h3>分块内容详情</h3>
        <button type="button" class="btn-ghost" id="closeChunkDetailModalBtn">关闭</button>
      </div>
      <div id="chunkDetailContent" class="chunk-detail-content"></div>
    </section>
  </div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
