<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG 智能问答</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="bg-fx" id="bgFx" aria-hidden="true">
      <div class="bg-glow"></div>
      <div class="particle-layer" id="particleLayer"></div>
    </div>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon" aria-hidden="true">🤖</div>
          <div class="brand-text">
            <div class="brand-title">RAG 智能问答</div>
            <div class="brand-sub">Powered by AI</div>
          </div>
        </div>

        <button type="button" class="btn-new-chat" id="newChatBtn">
          <span class="btn-new-chat-icon">+</span>
          <span>新建对话</span>
        </button>

        <a class="link-admin" href="#" id="adminLink">管理后台</a>

        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            type="search"
            id="historySearch"
            class="search-input"
            placeholder="搜索对话..."
            autocomplete="off"
          />
          <kbd class="search-kbd">Ctrl / ⌘ + K</kbd>
        </div>

        <nav class="history-nav" id="historyNav" aria-label="对话历史"></nav>

        <div class="sidebar-footer">
          <div class="user-row">
            <div class="user-avatar" aria-hidden="true">A</div>
            <div class="user-meta">
              <span class="user-name" id="sidebarUserName">admin</span>
              <span class="user-role">用户</span>
            </div>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="main-header">
          <span class="main-title" id="mainTitle">新对话</span>
          <div class="main-header-actions">
            <button type="button" class="btn-icon" id="themeToggle" title="切换明暗">◐</button>
            <button type="button" class="btn-icon" id="starBtn" title="收藏">☆</button>
            <button type="button" class="btn-icon btn-logout" id="logoutBtn" title="退出登录">退出登录</button>
          </div>
        </header>

        <div class="main-inner" id="mainInner">
          <section class="hero" id="heroSection">
            <h1 class="hero-title">
              把问题变成<span class="hero-accent">清晰答案</span>
            </h1>
            <p class="hero-desc">
              结构化提问、知识检索与深度思考，一次对话给出可执行方案
            </p>
          </section>

          <section class="suggestions" id="suggestionsSection">
            <div class="suggestions-divider">
              <span class="suggestions-line"></span>
              <span class="suggestions-label">试试这些开场</span>
              <span class="suggestions-line"></span>
            </div>
            <div class="suggestion-cards" id="suggestionCards"></div>
          </section>

          <section class="chat-thread" id="chatThread" hidden aria-live="polite"></section>

          <div class="composer-wrap">
            <div class="composer">
              <textarea
                id="composerInput"
                class="composer-textarea"
                rows="3"
                placeholder="输入需要深度分析的问题..."
              ></textarea>
              <div class="composer-toolbar">
                <button type="button" class="pill-deep" id="deepThinkToggle" aria-pressed="true">
                  <span class="pill-dot" aria-hidden="true"></span>
                  <span class="pill-icon" aria-hidden="true">◎</span>
                  深度思考
                </button>
                <button type="button" class="btn-send" id="sendBtn" title="发送">
                  <span aria-hidden="true">➤</span>
                </button>
              </div>
            </div>
            <p class="composer-hint">Enter 发送 · Shift + Enter 换行</p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
